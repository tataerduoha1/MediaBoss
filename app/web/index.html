<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>MediaBoss</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0556b'/%3E%3Cpath d='M11 9.5v13l11-6.5z' fill='%23fff'/%3E%3C/svg%3E">
<script>
/* 主题防闪烁：CSS 加载前应用本地主题偏好 */
(function(){try{var t=localStorage.getItem("mb_theme")||"dark";document.documentElement.setAttribute("data-theme",t==="auto"?"auto":t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/css/app.css?v=4">
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script type="module">
/* 自愈引导：浏览器残留旧缓存导致模块图加载失败时，自动强刷一次；再失败则给出自救提示 */
try {
  await import("/js/app.js?v=4");
} catch (e) {
  if (!sessionStorage.getItem("mb_boot_reload")) {
    sessionStorage.setItem("mb_boot_reload", "1");
    location.reload(true);
  } else {
    document.getElementById("app").innerHTML =
      '<div style="padding:60px 20px;text-align:center;color:#8a93a6;font-size:14px">资源加载异常。<br>请按 <b>Ctrl+Shift+R</b> 强制刷新，或清空浏览器缓存后重试。</div>';
  }
}
</script>
</body>
</html>
